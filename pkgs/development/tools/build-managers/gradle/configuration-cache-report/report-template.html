<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Gradle report</title>
<style>body { font-family: sans-serif; } pre { white-space: pre-wrap; }</style>
</head>
<body>
<p>This Gradle was built from source without its report viewer (Kotlin/JS).  The data of the report follows as JSON.</p>
<script type="text/javascript" src="configuration-cache-report-data.js"></script>
<pre id="report"></pre>
<script>
document.getElementById("report").textContent = Array.from(
  document.querySelectorAll('script[type="application/json"]')
).map(function (e) {
  var text = e.textContent;
  try { text = JSON.stringify(JSON.parse(text), null, 2); } catch (x) { }
  return e.id + ":\n" + text;
}).join("\n\n");
</script>
</body>
</html>
